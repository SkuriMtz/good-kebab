# Integración continua: en cada push y pull request revisa tipos, lint, pruebas,
# dependencias, que compile y una prueba de humo contra la app arrancada.
# No usa ningún secreto: el build de Next compila sin variables de entorno.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Tipos, lint, pruebas, build y humo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Auditoría de dependencias (solo las que van a producción)
        run: npm audit --omit=dev --audit-level=high

      - name: Build de Next (sin variables secretas)
        run: npx next build

      - name: Prueba de humo (app arrancada)
        env:
          # La app corre como producción para revisar lo que en producción debe estar cerrado
          VERCEL_ENV: production
          HUMO_PRODUCCION: "1"
          BASE_URL: http://localhost:3300
        run: |
          npx next start -p 3300 > next-start.log 2>&1 &
          servidor=$!
          trap 'kill "$servidor" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "$BASE_URL/precios"; then break; fi
            sleep 1
          done
          npm run humo || { echo "--- registro del servidor ---"; cat next-start.log; exit 1; }

  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # todo el historial
          persist-credentials: false

      # Sin la acción oficial (pide licencia en organizaciones): se baja el binario
      # de la versión fija y se comprueba su suma antes de usarlo.
      - name: Instalar gitleaks v8.21.2
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz

      - name: Buscar secretos en todo el historial
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --redact -c .gitleaks.toml'
